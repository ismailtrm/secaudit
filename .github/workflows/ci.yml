name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch
# or PR, so superseded runs don't keep burning runner minutes. Pushing a branch
# runs CI only on main or when it has an open PR (avoids the push+PR double run).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, vet, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race -cover ./...

      - name: Lint (golangci-lint)
        # Built from source with the runner's Go so the linter's build version
        # is not older than go.mod's target (a prebuilt binary is compiled with
        # an older Go and refuses to analyze a newer target). Pinned to the v2
        # release the .golangci.yml (v2 schema) was validated against.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
